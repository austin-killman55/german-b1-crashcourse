<!DOCTYPE html>
<!--
  ====================================================================
  WERBUNG: Pünktliche Bahn  (Hausaufgabe)
  ====================================================================
  So schreibst du deinen Text:

  Alle Stellen für Text sind leer, zum Beispiel:
      <h1 class="t" data-hint="Große Überschrift"></h1>

  Schreib deinen Text zwischen > und </ :
      <h1 class="t" data-hint="Große Überschrift">Immer pünktlich!</h1>

  Im Browser siehst du einen gestrichelten Kasten, solange die Stelle
  leer ist. Wenn du Text schreibst, verschwindet der Kasten.

  Suche nach  data-hint  – dann findest du alle leeren Stellen.
  ====================================================================
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<!-- Titel im Browser-Tab: -->
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e1a2b;
    --night-2:#16263d;
    --ink:#15202e;
    --muted:#5d6878;
    --paper:#f5f6f3;
    --card:#ffffff;
    --line:#e2e5e9;
    --go:#17a34a;        /* Signal grün = pünktlich */
    --go-soft:#e3f5e9;
    --amber:#f5b400;     /* Anzeigetafel */
    --display:'Space Grotesk',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--display);color:var(--ink);background:var(--paper);line-height:1.55;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  svg{display:block}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px}

  /* ---------- Platzhalter: leere Textstellen ---------- */
  .t:empty::before{
    content:"✏️ " attr(data-hint);
    display:inline-block;
    font-size:.8rem;font-weight:500;letter-spacing:.02em;
    font-family:var(--display);
    color:#7a8494;
    border:1.5px dashed #aab2bf;border-radius:8px;
    padding:.35em .7em;
    background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(120,130,150,.06) 8px 16px);
    white-space:normal;max-width:100%;
  }
  .dark .t:empty::before,.t.on-dark:empty::before{color:#b9c4d4;border-color:#4d6078;background:rgba(255,255,255,.04)}
  body.hide-hints .t:empty::before{visibility:hidden}

  /* ---------- Navigation ---------- */
  nav{position:sticky;top:0;z-index:50;background:rgba(14,26,43,.92);backdrop-filter:blur(10px);color:#fff}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem}
  .logo{width:42px;height:42px;flex:none}
  .links{display:flex;gap:22px;align-items:center}
  .links a{opacity:.85;transition:opacity .2s}
  .links a:hover{opacity:1}
  .burger{display:none;background:none;border:0;color:#fff;cursor:pointer}
  @media (max-width:820px){
    .links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:flex-start;background:var(--night);padding:18px 20px 24px}
    .links.open{display:flex}
    .burger{display:block}
  }

  /* ---------- Knöpfe ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;transition:transform .15s,box-shadow .15s;cursor:pointer;border:0;font-family:inherit;font-size:1rem}
  .btn:hover{transform:translateY(-2px)}
  .btn-go{background:var(--go);color:#fff;box-shadow:0 8px 24px rgba(23,163,74,.35)}
  .btn-ghost{border:2px solid rgba(255,255,255,.35);color:#fff}
  .btn.t:empty::before{border:0;background:none;padding:0;color:inherit;opacity:.85}
  .btn-go.t:empty{min-width:150px;justify-content:center}
  .btn-ghost.t:empty{min-width:150px;justify-content:center}

  /* ---------- Hero ---------- */
  .hero{background:radial-gradient(1200px 500px at 80% -10%,#23446b 0,transparent 60%),var(--night);color:#fff;padding:80px 0 0;position:relative;overflow:hidden}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:10px;background:rgba(23,163,74,.15);border:1px solid rgba(23,163,74,.5);color:#8ff0b0;border-radius:999px;padding:6px 14px 6px 10px;font-size:.9rem;margin-bottom:22px}
  .pulse{width:10px;height:10px;border-radius:50%;background:#34d36b;box-shadow:0 0 0 0 rgba(52,211,107,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(52,211,107,0)}100%{box-shadow:0 0 0 0 rgba(52,211,107,0)}}
  .hero h1{font-size:clamp(2.3rem,5.5vw,4.2rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:20px}
  .hero h1.t:empty::before{font-size:1.4rem;padding:.6em 1em}
  .hero .lead{font-size:1.2rem;color:#c8d3e2;max-width:34em;margin-bottom:34px}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap}

  /* Bahnhofsuhr */
  .clock-card{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:18px}
  .station-clock{width:min(300px,70vw);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
  .digital{font-family:var(--mono);font-size:1.6rem;letter-spacing:.08em;background:#000;color:var(--amber);padding:8px 18px;border-radius:10px;border:1px solid #333}

  /* Zug fährt */
  .track{position:relative;height:120px;margin-top:60px}
  .rails{position:absolute;left:0;right:0;bottom:18px;height:14px;background:
      repeating-linear-gradient(90deg,#5a4630 0 10px,transparent 10px 36px);}
  .rails::before,.rails::after{content:"";position:absolute;left:0;right:0;height:3px;background:#8c99ab}
  .rails::before{top:0}.rails::after{bottom:0}
  .train{position:absolute;bottom:26px;left:0;width:520px;animation:drive 14s linear infinite}
  @keyframes drive{from{transform:translateX(-560px)}to{transform:translateX(calc(100vw + 40px))}}
  @media (prefers-reduced-motion:reduce){.train{animation:none;transform:translateX(20px)}.pulse{animation:none}}

  /* ---------- Abschnitte ---------- */
  section{padding:90px 0}
  .kicker{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--go);margin-bottom:10px;display:block}
  .kicker.t:empty::before{text-transform:none;letter-spacing:.02em}
  h2{font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.15;letter-spacing:-.015em;margin-bottom:14px}
  .sub{color:var(--muted);font-size:1.1rem;max-width:40em}
  .head{margin-bottom:48px}
  .head.center{text-align:center}
  .head.center .sub{margin:0 auto}

  /* Zahlen */
  .stats{background:var(--card);border-bottom:1px solid var(--line);padding:0}
  .stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat{padding:34px 20px;text-align:center;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat .num{font-size:2.6rem;font-weight:700;color:var(--go);line-height:1.1;margin-bottom:6px;display:block}
  .stat .num.t:empty::before{font-size:.8rem}
  .stat .lbl{color:var(--muted);display:block}
  @media (max-width:820px){.stats .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

  /* Anzeigetafel */
  .board{background:#0b1320;border-radius:var(--r);padding:26px;box-shadow:0 30px 60px -20px rgba(14,26,43,.5);overflow-x:auto}
  .board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .board-title{font-family:var(--mono);color:#fff;font-size:1.1rem;display:flex;gap:12px;align-items:center}
  .board-time{font-family:var(--mono);color:var(--amber);font-size:1.3rem}
  table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:640px}
  th{font-family:var(--mono);font-weight:500;color:#7f8ea3;text-align:left;font-size:.8rem;padding:0 12px}
  td{background:#141f31;color:var(--amber);font-family:var(--mono);font-size:1.05rem;padding:14px 12px;border-top:1px solid #1f2d44;border-bottom:1px solid #0a111c}
  td:first-child{border-radius:8px 0 0 8px}
  td:last-child{border-radius:0 8px 8px 0}
  .status{display:flex;align-items:center;gap:10px;color:#6ff09a}
  .led{width:12px;height:12px;border-radius:50%;background:#34d36b;box-shadow:0 0 12px #34d36b;flex:none}
  .gleis{display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:8px;background:#fff;color:#0b1320;font-weight:700}
  .gleis.t:empty::before{font-size:.6rem;padding:.2em .3em;border:0;background:none;white-space:normal}
  tr{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
  .board.in tr{opacity:1;transform:none}
  .board.in tr:nth-child(2){transition-delay:.1s}.board.in tr:nth-child(3){transition-delay:.2s}
  .board.in tr:nth-child(4){transition-delay:.3s}.board.in tr:nth-child(5){transition-delay:.4s}

  /* Vorteile */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  @media (max-width:900px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -18px rgba(14,26,43,.25)}
  .icon{width:58px;height:58px;border-radius:16px;background:var(--go-soft);display:grid;place-items:center;margin-bottom:20px;color:var(--go)}
  .card h3{font-size:1.3rem;margin-bottom:10px}
  .card p{color:var(--muted)}

  /* Vorher / Nachher */
  .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:stretch}
  @media (max-width:820px){.compare{grid-template-columns:1fr}.vs{transform:rotate(90deg);justify-self:center}}
  .side{border-radius:var(--r);padding:34px;display:flex;flex-direction:column;gap:16px}
  .side.bad{background:#fdecec;border:1px solid #f4c7c7}
  .side.good{background:var(--go-soft);border:1px solid #b7e4c6}
  .side h3{font-size:1.4rem}
  .side ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  .side li{display:flex;gap:12px;align-items:flex-start}
  .mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;margin-top:1px}
  .bad .mark{background:#d83f45}.good .mark{background:var(--go)}
  .vs{align-self:center;display:grid;place-items:center}

  /* Stimmen */
  .quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  @media (max-width:900px){.quotes{grid-template-columns:1fr}}
  .quote{background:var(--card);border-radius:var(--r);padding:30px;border:1px solid var(--line);display:flex;flex-direction:column;gap:18px;position:relative}
  .quote::before{content:"“";position:absolute;top:6px;right:22px;font-size:5rem;line-height:1;color:var(--go-soft);font-weight:700}
  .stars{display:flex;gap:3px;color:var(--amber)}
  .quote p{font-size:1.05rem}
  .who{display:flex;align-items:center;gap:14px;margin-top:auto}
  .avatar{width:48px;height:48px;border-radius:50%;flex:none}
  .who b{display:block}
  .who span{color:var(--muted);font-size:.9rem;display:block}

  /* Preise */
  .prices{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:center}
  @media (max-width:900px){.prices{grid-template-columns:1fr}}
  .ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:34px;position:relative;display:flex;flex-direction:column;gap:18px}
  .ticket.best{background:var(--night);color:#fff;border:0;padding:44px 34px;box-shadow:0 30px 60px -20px rgba(14,26,43,.55)}
  .ticket.best .t:empty::before{color:#b9c4d4;border-color:#4d6078}
  .ribbon{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--go);color:#fff;border-radius:999px;padding:6px 16px;font-size:.85rem;font-weight:700;white-space:nowrap}
  .ribbon.t:empty::before{border:0;background:none;color:#fff;padding:0}
  .ticket h3{font-size:1.25rem}
  .price{font-size:2.8rem;font-weight:700;line-height:1}
  .price.t:empty::before{font-size:.8rem}
  .ticket ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .ticket li{display:flex;gap:10px;align-items:center}
  .ticket li svg{color:var(--go);flex:none}
  .ticket .btn{justify-content:center;margin-top:8px}
  .btn-line{border:2px solid var(--line);color:var(--ink)}
  .btn-line.t:empty::before{color:var(--muted)}

  /* FAQ */
  .faq{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:20px 24px;font-weight:700;font-size:1.08rem;display:flex;justify-content:space-between;align-items:center;gap:16px}
  summary::-webkit-details-marker{display:none}
  summary .plus{flex:none;width:28px;height:28px;border-radius:50%;background:var(--go-soft);color:var(--go);display:grid;place-items:center;transition:transform .25s}
  details[open] summary .plus{transform:rotate(45deg)}
  details .answer{padding:0 24px 22px;color:var(--muted)}

  /* Aufruf */
  .final{background:linear-gradient(120deg,var(--go),#0f7a37);color:#fff;border-radius:28px;padding:64px 40px;text-align:center;position:relative;overflow:hidden}
  .final::after{content:"";position:absolute;inset:auto -60px -120px auto;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.08)}
  .final h2{color:#fff}
  .final .sub{color:#e0f5e8;margin:0 auto 30px}
  .final .t:empty::before{color:#e0f5e8;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.06)}
  .final .btn-white{background:#fff;color:#0f7a37}
  .final .btn-white.t:empty::before{color:#0f7a37;border:0;background:none;padding:0}
  .final .btn-white.t:empty{min-width:170px;justify-content:center}

  /* Fußzeile */
  footer{background:var(--night);color:#aeb9c9;padding:60px 0 30px;margin-top:90px}
  .foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;margin-bottom:40px}
  @media (max-width:820px){.foot{grid-template-columns:1fr 1fr}}
  footer h4{color:#fff;margin-bottom:14px}
  footer ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .copy{border-top:1px solid #253650;padding-top:24px;font-size:.9rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* Einblenden beim Scrollen */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

  /* Schalter: Platzhalter zeigen / verstecken */
  .hint-toggle{position:fixed;right:16px;bottom:16px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.3);cursor:pointer;font-size:1.1rem;line-height:1}
  @media (max-width:820px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero{padding-top:50px}}
</style>
</head>
<body>

<!-- =================== NAVIGATION =================== -->
<nav class="dark">
  <div class="wrap">
    <a href="#" class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="12" fill="#17a34a"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="#fff" stroke-width="3"/>
        <path d="M24 15v9l6 4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="t on-dark" data-hint="Name vom Produkt"></span>
    </a>
    <button class="burger" aria-label="Menü" onclick="document.querySelector('.links').classList.toggle('open')">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="links">
      <a href="#vorteile" class="t on-dark" data-hint="Link 1"></a>
      <a href="#tafel" class="t on-dark" data-hint="Link 2"></a>
      <a href="#preise" class="t on-dark" data-hint="Link 3"></a>
      <a href="#fragen" class="t on-dark" data-hint="Link 4"></a>
      <a href="#preise" class="btn btn-go t" data-hint="Knopf" style="padding:10px 20px"></a>
    </div>
  </div>
</nav>

<!-- =================== HERO (oben, groß) =================== -->
<header class="hero dark">
  <div class="wrap hero-grid">
    <div>
      <span class="badge"><span class="pulse"></span><span class="t on-dark" data-hint="Kleiner Hinweis"></span></span>
      <h1 class="t on-dark" data-hint="Große Überschrift / Slogan"></h1>
      <p class="lead t on-dark" data-hint="Ein oder zwei Sätze über das Produkt"></p>
      <div class="cta-row">
        <a href="#preise" class="btn btn-go t" data-hint="Knopf 1"></a>
        <a href="#tafel" class="btn btn-ghost t" data-hint="Knopf 2"></a>
      </div>
    </div>

    <div class="clock-card">
      <!-- Bahnhofsuhr: zeigt die echte Uhrzeit -->
      <svg class="station-clock" viewBox="0 0 200 200" aria-label="Uhr">
        <circle cx="100" cy="100" r="96" fill="#fff" stroke="#c9d1dc" stroke-width="6"/>
        <g id="ticks"></g>
        <line id="hHand" x1="100" y1="112" x2="100" y2="52" stroke="#111" stroke-width="9" stroke-linecap="square"/>
        <line id="mHand" x1="100" y1="116" x2="100" y2="24" stroke="#111" stroke-width="6" stroke-linecap="square"/>
        <g id="sHand">
          <line x1="100" y1="128" x2="100" y2="44" stroke="#17a34a" stroke-width="2.5"/>
          <circle cx="100" cy="42" r="9" fill="#17a34a"/>
        </g>
        <circle cx="100" cy="100" r="4" fill="#17a34a"/>
      </svg>
      <div class="digital" id="digital">--:--:--</div>
    </div>
  </div>

  <!-- Der Zug fährt durch das Bild -->
  <div class="track" aria-hidden="true">
    <div class="rails"></div>
    <svg class="train" viewBox="0 0 520 80">
      <!-- Lok -->
      <path d="M8 70 V28 Q8 12 30 10 H120 Q150 12 160 40 L166 70 Z" fill="#f4f6f8"/>
      <path d="M118 16 Q142 18 152 40 H118 Z" fill="#16263d"/>
      <rect x="8" y="50" width="158" height="6" fill="#17a34a"/>
      <rect x="26" y="22" width="22" height="18" rx="3" fill="#16263d"/>
      <rect x="56" y="22" width="22" height="18" rx="3" fill="#16263d"/>
      <rect x="86" y="22" width="22" height="18" rx="3" fill="#16263d"/>
      <circle cx="156" cy="62" r="3" fill="#ffe27a"/>
      <!-- Wagen 1 -->
      <rect x="172" y="12" width="164" height="58" rx="10" fill="#f4f6f8"/>
      <rect x="172" y="50" width="164" height="6" fill="#17a34a"/>
      <rect x="186" y="22" width="26" height="18" rx="3" fill="#16263d"/>
      <rect x="220" y="22" width="26" height="18" rx="3" fill="#16263d"/>
      <rect x="254" y="22" width="26" height="18" rx="3" fill="#16263d"/>
      <rect x="288" y="22" width="34" height="18" rx="3" fill="#16263d"/>
      <!-- Wagen 2 -->
      <rect x="342" y="12" width="170" height="58" rx="10" fill="#f4f6f8"/>
      <rect x="342" y="50" width="170" height="6" fill="#17a34a"/>
      <rect x="356" y="22" width="26" height="18" rx="3" fill="#16263d"/>
      <rect x="390" y="22" width="26" height="18" rx="3" fill="#16263d"/>
      <rect x="424" y="22" width="26" height="18" rx="3" fill="#16263d"/>
      <rect x="458" y="22" width="40" height="18" rx="3" fill="#16263d"/>
      <!-- Räder -->
      <g fill="#2b3647">
        <circle cx="34" cy="72" r="7"/><circle cx="130" cy="72" r="7"/>
        <circle cx="196" cy="72" r="7"/><circle cx="312" cy="72" r="7"/>
        <circle cx="366" cy="72" r="7"/><circle cx="488" cy="72" r="7"/>
      </g>
    </svg>
  </div>
</header>

<!-- =================== ZAHLEN =================== -->
<div class="stats">
  <div class="wrap">
    <div class="stat reveal"><span class="num t" data-hint="Zahl"></span><span class="lbl t" data-hint="Was bedeutet die Zahl?"></span></div>
    <div class="stat reveal"><span class="num t" data-hint="Zahl"></span><span class="lbl t" data-hint="Was bedeutet die Zahl?"></span></div>
    <div class="stat reveal"><span class="num t" data-hint="Zahl"></span><span class="lbl t" data-hint="Was bedeutet die Zahl?"></span></div>
    <div class="stat reveal"><span class="num t" data-hint="Zahl"></span><span class="lbl t" data-hint="Was bedeutet die Zahl?"></span></div>
  </div>
</div>

<!-- =================== VORTEILE =================== -->
<section id="vorteile">

<button class="hint-toggle" title="✏️ an / aus" onclick="document.body.classList.toggle('hide-hints')">✏️</button>

<script>
  // Bahnhofsuhr + Digitaluhr
  (function(){
    var ticks=document.getElementById('ticks'), ns='http://www.w3.org/2000/svg';
    for(var i=0;i<60;i++){
      var l=document.createElementNS(ns,'line'), big=i%5===0;
      l.setAttribute('x1',100);l.setAttribute('x2',100);
      l.setAttribute('y1',big?12:12);l.setAttribute('y2',big?32:20);
      l.setAttribute('stroke','#111');l.setAttribute('stroke-width',big?6:2.5);
      l.setAttribute('transform','rotate('+(i*6)+' 100 100)');
      ticks.appendChild(l);
    }
    var h=document.getElementById('hHand'),m=document.getElementById('mHand'),s=document.getElementById('sHand'),
        d=document.getElementById('digital'),b=document.getElementById('boardTime');
    function pad(n){return n<10?'0'+n:n}
    function tick(){
      var n=new Date(),sec=n.getSeconds()+n.getMilliseconds()/1000,min=n.getMinutes(),hr=n.getHours()%12;
      // wie eine echte Bahnhofsuhr: Sekunde läuft in 58,5 s herum und wartet oben
      var sa=Math.min(sec/58.5,1)*360;
      s.setAttribute('transform','rotate('+sa+' 100 100)');
      m.setAttribute('transform','rotate('+(min*6)+' 100 100)');
      h.setAttribute('transform','rotate('+(hr*30+min*.5)+' 100 100)');
      d.textContent=pad(n.getHours())+':'+pad(min)+':'+pad(n.getSeconds());
      b.textContent=pad(n.getHours())+':'+pad(min);
      requestAnimationFrame(tick);
    }
    tick();
  })();

  // Einblenden beim Scrollen
  (function(){
    var els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
    },{threshold:.15});
    els.forEach(function(e){io.observe(e)});
  })();
</script>
